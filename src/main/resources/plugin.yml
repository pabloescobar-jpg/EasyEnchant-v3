name: EnchantedGive
main: com.example.enchanter.EnchGivePlugin
version: 1.0.0
api-version: '1.20'
load: STARTUP
authors: [ you ]
softdepend: [Essentials, CMI, CommandBook]
loadbefore: [Essentials, CMI, CommandBook]

commands:
  give:
    description: Give items with enchantments (overrides vanilla/others)
    usage: /give <player> <material> <amount> [enchant[:level] ...]
    permission: enchanter.give
  egive:
    description: Same as /give, guaranteed to hit this plugin
    aliases: [enchantgive]
    usage: /egive <player> <material> <amount> [enchant[:level] ...]
    permission: enchanter.give

permissions:
  enchanter.give:
    default: op
