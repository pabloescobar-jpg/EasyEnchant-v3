commands:
  give:
    description: Give items with enchantments
    usage: /give <player> <material> <amount> [enchant[:lvl] ...] [name...] [&color]
    permission: enchanter.give
  egive:
    description: Alias of /give
    permission: enchanter.give
  permissiongive:
    description: Toggle GIVE permission for a player (OP only)
    usage: /permissiongive <player>
    permission: enchanter.admin

permissions:
  # Players who are granted this (or OPs) can use /give
  enchanter.give:
    default: false
  # OP-only admin power for /permissiongive
  enchanter.admin:
    default: op
